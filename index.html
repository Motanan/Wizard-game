<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="description" content="لعبة الساحر مرلين — فكّر في رقم أو فاكهة أو شخصية مشهورة، والساحر حايحاول يعرفها بالسحر!" />
<title>الساحر مرلين — لعبة تخمين سحرية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙‍♂️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<link rel="preload" href="assets/models/merlin-idle.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
<link rel="preload" href="assets/models/merlin-thinking.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
<link rel="preload" href="assets/models/merlin-happy.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
<link rel="preload" href="assets/models/merlin-sad.glb" as="fetch" type="model/gltf-binary" crossorigin="anonymous" />
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="app">

  <header class="app-header">
    <div class="header-row">
      <button class="icon-btn" id="btnHelp" aria-label="كيفن نلعب؟" title="كيفن نلعب؟">؟</button>
      <h1 class="logo"><span class="logo-star">✨</span> الساحر مرلين <span class="logo-star">✨</span></h1>
      <div class="header-controls">
        <button class="icon-btn" id="btnMute" aria-label="كتم / تشغيل الصوت" aria-pressed="false" title="الصوت">🔊</button>
        <div class="stars-badge" id="starsBadge" title="نجومك السحرية">
          <span aria-hidden="true">⭐</span><span id="starsCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">

    <div class="scenery" aria-hidden="true">
      <div class="moon"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <svg class="castle" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path d="M0,90 L0,55 L18,55 L18,38 L32,38 L32,55 L50,55 L50,28 L64,14 L78,28 L78,55 L100,55 L100,42 L114,42 L114,55 L140,55 L140,22 L156,6 L172,22 L172,55 L198,55 L198,40 L212,40 L212,55 L236,55 L236,30 L250,16 L264,30 L264,55 L290,55 L290,44 L302,44 L302,55 L330,55 L330,25 L345,10 L360,25 L360,55 L400,55 L400,90 Z" fill="#1b1044"/>
      </svg>
    </div>

    <div class="wizard-wrap" id="wizardWrap" data-state="idle">
      <div class="wizard-glow" aria-hidden="true"></div>

      <model-viewer
        id="wizardModel"
        class="wizard-model"
        src="assets/models/merlin-idle.glb"
        poster="assets/models/merlin-poster.png"
        alt="الساحر مرلين"
        environment-image="neutral"
        exposure="1.05"
        interaction-prompt="none"
        disable-zoom
        disable-pan
        disable-tap
      ></model-viewer>

      <div class="celebrate-burst" aria-hidden="true">
        <span class="burst-star" style="--i:0">✨</span>
        <span class="burst-star" style="--i:1">⭐</span>
        <span class="burst-star" style="--i:2">✨</span>
        <span class="burst-star" style="--i:3">⭐</span>
        <span class="burst-star" style="--i:4">✨</span>
        <span class="burst-star" style="--i:5">⭐</span>
      </div>

      <div class="speech-bubble" id="speechBubble">
        <p id="speechText" aria-live="polite"></p>
      </div>
    </div>

    <div class="progress-wrap" id="progressWrap" hidden>
      <span class="progress-label">قوة السحر</span>
      <span class="progress-extra" id="progressExtra"></span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- شاشة الترحيب -->
    <section class="panel active" id="panelWelcome">
      <div class="howto-row">
        <div class="howto-step"><span class="howto-icon">🎯</span><span>اختار فئة</span></div>
        <div class="howto-step"><span class="howto-icon">🤫</span><span>فكّر في حاجة وما تقول لحد!</span></div>
        <div class="howto-step"><span class="howto-icon">💬</span><span>جاوب بصدق وهو حايخمّن</span></div>
      </div>
      <button class="btn btn-primary" id="btnStart">يلا نبدأ! 🚀</button>
    </section>

    <!-- شاشة اختيار الفئة -->
    <section class="panel" id="panelCategory" hidden>
      <div class="cards">
        <button class="card" data-mode="number">
          <span class="card-icon">🔢</span>
          <span class="card-title">رقم</span>
        </button>
        <button class="card" data-mode="fruit">
          <span class="card-icon">🍎</span>
          <span class="card-title">فاكهة</span>
        </button>
        <button class="card" data-mode="character">
          <span class="card-icon">⭐</span>
          <span class="card-title">شخصية مشهورة</span>
        </button>
      </div>
    </section>

    <!-- شاشة اختيار صعوبة الأرقام -->
    <section class="panel" id="panelDifficulty" hidden>
      <div class="cards" id="difficultyCards">
        <button class="card" data-min="1" data-max="20">
          <span class="card-icon">🌱</span>
          <span class="card-title">سهل<br>1 – 20</span>
        </button>
        <button class="card" data-min="1" data-max="50">
          <span class="card-icon">🌟</span>
          <span class="card-title">متوسط<br>1 – 50</span>
        </button>
        <button class="card" data-min="1" data-max="100">
          <span class="card-icon">🔥</span>
          <span class="card-title">صعب<br>1 – 100</span>
        </button>
      </div>
    </section>

    <!-- شاشة الأسئلة -->
    <section class="panel" id="panelQuestion" hidden>
      <div class="answers" id="answers"></div>
    </section>

    <!-- شاشة التخمين -->
    <section class="panel" id="panelGuess" hidden>
      <div class="guess-card" id="guessCard">
        <div class="guess-emoji" id="guessEmoji"></div>
        <div class="guess-name" id="guessName"></div>
      </div>
      <div class="answers">
        <button class="btn btn-yes" id="btnCorrect">أيوة! 🎉</button>
        <button class="btn btn-no" id="btnWrong">لأ، حاول تاني 😅</button>
      </div>
    </section>

    <!-- شاشة الفوز -->
    <section class="panel" id="panelWin" hidden>
      <canvas id="confetti"></canvas>
      <div class="win-badge">🎉 عرفتها! 🎉</div>
      <div class="win-star-line" id="winStarLine">⭐ +1 نجمة سحرية!</div>
      <button class="btn btn-primary" id="btnPlayAgainWin">العب تاني 🔁</button>
    </section>

    <!-- شاشة الاستسلام -->
    <section class="panel" id="panelLose" hidden>
      <p class="lose-text" id="loseText">غلبتني المرة دي يا زول! 🌟 قول لي كانت شنو؟</p>
      <div class="reveal-wrap" id="revealWrap">
        <div class="reveal-list" id="revealList"></div>
      </div>
      <button class="btn btn-primary" id="btnPlayAgainLose">العب تاني 🔁</button>
    </section>

  </main>

  <footer class="app-footer">صُنعت بسحر ✨ للأصدقاء الصغار</footer>
</div>

<div class="overlay" id="helpOverlay" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle">كيفن نلعب؟ 🪄</h2>
    <div class="howto-row">
      <div class="howto-step"><span class="howto-icon">🎯</span><span>اختار فئة</span></div>
      <div class="howto-step"><span class="howto-icon">🤫</span><span>فكّر في حاجة وما تقول لحد!</span></div>
      <div class="howto-step"><span class="howto-icon">💬</span><span>جاوب بصدق وهو حايخمّن</span></div>
    </div>
    <button class="btn btn-primary" id="btnHelpClose">تمام، يلا ✨</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
