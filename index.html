<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="description" content="لعبة الساحر مرلين — فكّر في رقم أو فاكهة أو شخصية مشهورة، والساحر هيحاول يعرفها بالسحر!" />
<title>الساحر مرلين — لعبة تخمين سحرية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙‍♂️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="app">

  <header class="app-header">
    <div class="header-row">
      <button class="icon-btn" id="btnHelp" aria-label="ازاي نلعب؟" title="ازاي نلعب؟">؟</button>
      <h1 class="logo"><span class="logo-star">✨</span> الساحر مرلين <span class="logo-star">✨</span></h1>
      <div class="header-controls">
        <button class="icon-btn" id="btnMute" aria-label="كتم / تشغيل الصوت" aria-pressed="false" title="الصوت">🔊</button>
        <div class="stars-badge" id="starsBadge" title="نجومك السحرية">
          <span aria-hidden="true">⭐</span><span id="starsCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="stage">

    <div class="scenery" aria-hidden="true">
      <div class="moon"></div>
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <svg class="castle" viewBox="0 0 400 90" preserveAspectRatio="none">
        <path d="M0,90 L0,55 L18,55 L18,38 L32,38 L32,55 L50,55 L50,28 L64,14 L78,28 L78,55 L100,55 L100,42 L114,42 L114,55 L140,55 L140,22 L156,6 L172,22 L172,55 L198,55 L198,40 L212,40 L212,55 L236,55 L236,30 L250,16 L264,30 L264,55 L290,55 L290,44 L302,44 L302,55 L330,55 L330,25 L345,10 L360,25 L360,55 L400,55 L400,90 Z" fill="#1b1044"/>
      </svg>
    </div>

    <div class="wizard-wrap">
      <div class="wizard-glow" aria-hidden="true"></div>

      <svg class="wizard-svg" id="wizardSvg" data-state="idle" viewBox="0 0 240 320" role="img" aria-label="الساحر مرلين">
        <defs>
          <radialGradient id="orbGlow" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#fff6d8"/>
            <stop offset="45%" stop-color="#ffd25c"/>
            <stop offset="100%" stop-color="#ff9f4a" stop-opacity="0.2"/>
          </radialGradient>
          <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c4de0"/>
            <stop offset="100%" stop-color="#3c1f8a"/>
          </linearGradient>
          <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8a5cf0"/>
            <stop offset="100%" stop-color="#4a2599"/>
          </linearGradient>
          <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <ellipse class="ground-glow" cx="120" cy="298" rx="86" ry="14" fill="url(#groundGlow)"/>

        <!-- الذراع الرافعة للعصا -->
        <path d="M168,182 Q202,158 193,120" stroke="url(#robeGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>

        <!-- العصا والكرة السحرية -->
        <g class="staff">
          <rect x="187" y="118" width="7" height="128" rx="3.5" fill="#e3b45a"/>
          <g class="orb">
            <circle cx="190" cy="108" r="17" fill="url(#orbGlow)"/>
            <circle cx="190" cy="108" r="17" fill="none" stroke="#fff3d0" stroke-width="1" opacity="0.6"/>
          </g>
          <path class="sparkle sparkle-a" d="M167 90 l3 8 8 3 -8 3 -3 8 -3-8-8-3 8-3z" fill="#fff3d0"/>
          <path class="sparkle sparkle-b" d="M210 128 l2.4 6.4 6.4 2.4 -6.4 2.4-2.4 6.4-2.4-6.4-6.4-2.4 6.4-2.4z" fill="#ffd25c"/>
        </g>

        <!-- الجسم / العباءة -->
        <path class="robe" d="M120,118 C98,118 66,140 68,182 C70,224 62,266 82,306 L158,306 C178,266 170,224 172,182 C174,140 142,118 120,118 Z" fill="url(#robeGrad)"/>

        <!-- نجوم على العباءة -->
        <path class="sparkle sparkle-c" d="M100 210 l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#ffe9a8" opacity="0.85"/>
        <path class="sparkle sparkle-d" d="M142 250 l2 5.4 5.4 2-5.4 2-2 5.4-2-5.4-5.4-2 5.4-2z" fill="#ffe9a8" opacity="0.8"/>
        <path class="sparkle sparkle-e" d="M96 260 l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8z" fill="#ffe9a8" opacity="0.7"/>

        <!-- الحزام -->
        <rect x="76" y="200" width="88" height="15" rx="7.5" fill="#f4c95d"/>
        <circle cx="120" cy="207" r="9" fill="#fff6d8" stroke="#caa14d" stroke-width="2.5"/>

        <!-- الذراع الأخرى (بتلوّح) -->
        <path class="wave-arm" d="M74,182 Q42,160 50,124" stroke="url(#robeGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
        <circle class="wave-hand" cx="50" cy="120" r="12.5" fill="#ffd0a0"/>

        <!-- اللحية -->
        <path class="beard" d="M83,88 Q76,140 120,146 Q164,140 157,88 Q152,122 120,124 Q88,122 83,88 Z" fill="#fdfaf3"/>

        <!-- الوش -->
        <circle cx="120" cy="80" r="37" fill="#ffd0a0"/>
        <circle cx="98" cy="92" r="6.5" fill="#ff9eb0" opacity="0.55"/>
        <circle cx="142" cy="92" r="6.5" fill="#ff9eb0" opacity="0.55"/>

        <g class="eyes">
          <ellipse cx="107" cy="76" rx="4.2" ry="6.4" fill="#2a1259"/>
          <ellipse cx="133" cy="76" rx="4.2" ry="6.4" fill="#2a1259"/>
          <circle cx="105.4" cy="73" r="1.4" fill="#fff"/>
          <circle cx="131.4" cy="73" r="1.4" fill="#fff"/>
        </g>

        <!-- الفم: ثلاث حالات مختلفة حسب مشاعر الساحر -->
        <path class="mouth mouth-neutral" d="M104,96 Q120,107 136,96" stroke="#a35a2d" stroke-width="3.4" fill="none" stroke-linecap="round"/>
        <path class="mouth mouth-happy" d="M99,94 Q120,122 141,94" stroke="#a35a2d" stroke-width="3.6" fill="none" stroke-linecap="round"/>
        <path class="mouth mouth-sad" d="M105,102 Q120,90 135,102" stroke="#a35a2d" stroke-width="3.4" fill="none" stroke-linecap="round"/>

        <!-- الحواجب -->
        <path class="brow brow-left" d="M99,63 Q107,58 115,62" stroke="#fdfaf3" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="brow brow-right" d="M125,62 Q133,58 141,63" stroke="#fdfaf3" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- القبعة -->
        <path class="hat" d="M120,4 L167,84 Q120,95 73,84 Z" fill="url(#hatGrad)"/>
        <rect x="70" y="79" width="100" height="13" rx="6.5" fill="#f4c95d"/>
        <path class="sparkle sparkle-f" d="M120 28 l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#ffe9a8"/>
        <path class="sparkle sparkle-g" d="M138 52 l2 5.4 5.4 2-5.4 2-2 5.4-2-5.4-5.4-2 5.4-2z" fill="#fff3d0" opacity="0.85"/>

        <!-- انفجار نجوم الاحتفال عند الفوز -->
        <g class="celebrate-burst" aria-hidden="true">
          <path d="M60 60 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffe9a8" style="animation-delay:0s"/>
          <path d="M182 66 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd25c" style="animation-delay:.12s"/>
          <path d="M120 20 l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#fff3d0" style="animation-delay:.06s"/>
          <path d="M45 150 l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#6fe3ff" style="animation-delay:.18s"/>
          <path d="M197 150 l2.6 7 7 2.6-7 2.6-2.6 7-2.6-7-7-2.6 7-2.6z" fill="#ff6fb7" style="animation-delay:.24s"/>
        </g>
      </svg>

      <div class="speech-bubble" id="speechBubble">
        <p id="speechText" aria-live="polite"></p>
      </div>
    </div>

    <div class="progress-wrap" id="progressWrap" hidden>
      <span class="progress-label">قوة السحر</span>
      <span class="progress-extra" id="progressExtra"></span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- شاشة الترحيب -->
    <section class="panel active" id="panelWelcome">
      <div class="howto-row">
        <div class="howto-step"><span class="howto-icon">🎯</span><span>اختار فئة</span></div>
        <div class="howto-step"><span class="howto-icon">🤫</span><span>فكّر في حاجة وما تقولهاش!</span></div>
        <div class="howto-step"><span class="howto-icon">💬</span><span>جاوب بصدق وهو هيخمّن</span></div>
      </div>
      <button class="btn btn-primary" id="btnStart">يلا نبدأ! 🚀</button>
    </section>

    <!-- شاشة اختيار الفئة -->
    <section class="panel" id="panelCategory" hidden>
      <div class="cards">
        <button class="card" data-mode="number">
          <span class="card-icon">🔢</span>
          <span class="card-title">رقم</span>
        </button>
        <button class="card" data-mode="fruit">
          <span class="card-icon">🍎</span>
          <span class="card-title">فاكهة</span>
        </button>
        <button class="card" data-mode="character">
          <span class="card-icon">⭐</span>
          <span class="card-title">شخصية مشهورة</span>
        </button>
      </div>
    </section>

    <!-- شاشة اختيار صعوبة الأرقام -->
    <section class="panel" id="panelDifficulty" hidden>
      <div class="cards" id="difficultyCards">
        <button class="card" data-min="1" data-max="20">
          <span class="card-icon">🌱</span>
          <span class="card-title">سهل<br>1 – 20</span>
        </button>
        <button class="card" data-min="1" data-max="50">
          <span class="card-icon">🌟</span>
          <span class="card-title">متوسط<br>1 – 50</span>
        </button>
        <button class="card" data-min="1" data-max="100">
          <span class="card-icon">🔥</span>
          <span class="card-title">صعب<br>1 – 100</span>
        </button>
      </div>
    </section>

    <!-- شاشة الأسئلة -->
    <section class="panel" id="panelQuestion" hidden>
      <div class="answers" id="answers"></div>
    </section>

    <!-- شاشة التخمين -->
    <section class="panel" id="panelGuess" hidden>
      <div class="guess-card" id="guessCard">
        <div class="guess-emoji" id="guessEmoji"></div>
        <div class="guess-name" id="guessName"></div>
      </div>
      <div class="answers">
        <button class="btn btn-yes" id="btnCorrect">أيوة! 🎉</button>
        <button class="btn btn-no" id="btnWrong">لأ، حاول تاني 😅</button>
      </div>
    </section>

    <!-- شاشة الفوز -->
    <section class="panel" id="panelWin" hidden>
      <canvas id="confetti"></canvas>
      <div class="win-badge">🎉 عرفتها! 🎉</div>
      <div class="win-star-line" id="winStarLine">⭐ +1 نجمة سحرية!</div>
      <button class="btn btn-primary" id="btnPlayAgainWin">العب تاني 🔁</button>
    </section>

    <!-- شاشة الاستسلام -->
    <section class="panel" id="panelLose" hidden>
      <p class="lose-text" id="loseText">كسبتني المرة دي يا بطل! 🌟 قوللي كان ايه؟</p>
      <div class="reveal-wrap" id="revealWrap">
        <div class="reveal-list" id="revealList"></div>
      </div>
      <button class="btn btn-primary" id="btnPlayAgainLose">العب تاني 🔁</button>
    </section>

  </main>

  <footer class="app-footer">صُنعت بسحر ✨ للأصدقاء الصغار</footer>
</div>

<div class="overlay" id="helpOverlay" hidden>
  <div class="overlay-card" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle">ازاي نلعب؟ 🪄</h2>
    <div class="howto-row">
      <div class="howto-step"><span class="howto-icon">🎯</span><span>اختار فئة</span></div>
      <div class="howto-step"><span class="howto-icon">🤫</span><span>فكّر في حاجة وما تقولهاش!</span></div>
      <div class="howto-step"><span class="howto-icon">💬</span><span>جاوب بصدق وهو هيخمّن</span></div>
    </div>
    <button class="btn btn-primary" id="btnHelpClose">تمام، يلا ✨</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
